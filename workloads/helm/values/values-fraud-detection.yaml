    value: "__REGION__"
  - name: TRANSACTIONS_TABLE
    value: "__NAME_PREFIX__-transactions"
  - name: FRAUD_EVENTS_TABLE
    value: "__NAME_PREFIX__-fraud-events"
  - name: EVENT_BUS_NAME
    value: "__NAME_PREFIX__-events"
